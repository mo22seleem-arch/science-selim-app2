# ضع هذا الملف في جذر المشروع (بجوار pubspec.yaml) باسم codemagic.yaml
# متغيرات البيئة المطلوبة (Codemagic > App > Environment variables > Group اسمه "supabase"):
#   SUPABASE_URL        = https://xxxx.supabase.co
#   SUPABASE_ANON_KEY   = (anon public key)
#
# تثبيت نسخة Flutter: بعد أول build ناجح افتح خطوة "Flutter version" في الـ log وانسخ الرقم
# (مثلاً 3.47.2) وضعه بدل stable في السطرين تحت، حتى لا ينكسر البناء عند صدور تحديث جديد.

workflows:

  # ---------- 1) للتجربة السريعة على الموبايل (Debug APK) ----------
  android-debug-apk:
    name: Android Debug APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
      groups:
        - supabase
    scripts:
      - name: Flutter version (للتثبيت لاحقاً)
        script: flutter --version
      - name: Fetch Amiri font (يحمّل الخط ويدمجه)
        script: bash tool/fetch_fonts.sh
      - name: Get packages
        script: flutter pub get
      - name: Build debug APK
        script: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

  # ---------- 2) نسخة قريبة من النهائية (Release APK، مشفّرة ومصغّرة) ----------
  android-release-apk:
    name: Android Release APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
      groups:
        - supabase
    scripts:
      - name: Flutter version (للتثبيت لاحقاً)
        script: flutter --version
      - name: Fetch Amiri font (يحمّل الخط ويدمجه)
        script: bash tool/fetch_fonts.sh
      - name: Get packages
        script: flutter pub get
      - name: Build release APK
        script: |
          flutter build apk --release \
            --obfuscate --split-debug-info=build/symbols \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY \
            --dart-define=GCP_PROJECT_NUMBER=${GCP_PROJECT_NUMBER:-}
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/symbols/**
